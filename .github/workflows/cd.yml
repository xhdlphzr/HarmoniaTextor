name: CD

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: HarmoniaTextor-windows
          - os: macos-latest
            artifact: HarmoniaTextor-macos
          - os: ubuntu-latest
            artifact: HarmoniaTextor-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.x"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --extra desktop --group dev

      - name: Build bundle with PyInstaller
        run: uv run --no-sync pyinstaller --noconfirm --clean HarmoniaTextor.spec

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: 7z a -v1g -tzip "${{ matrix.artifact }}.zip" .\dist\HarmoniaTextor\*

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          tar -czf archive.tar.gz -C dist HarmoniaTextor.app
          split -b 1024m -d archive.tar.gz "${{ matrix.artifact }}.tar.gz.part-"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tar -czf archive.tar.gz -C dist HarmoniaTextor
          split -b 1024m -d archive.tar.gz "${{ matrix.artifact }}.tar.gz.part-"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.*

name: CD

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: "Install dependencies (incl. dev: pyinstaller)"
        run: uv sync --frozen --extra desktop

      - name: Install zip (Windows)
        if: runner.os == 'Windows'
        run: choco install zip -y

      - name: Install zip (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y zip

      # ---------- Windows / macOS / Linux: PyInstaller 出包（onedir 目录） ----------
      - name: Build with PyInstaller
        run: uv run --no-sync pyinstaller HarmoniaTextor.spec --clean

      # ---------- 分卷压缩（统一 zip -s 1g） ----------
      - name: Compress into 1GB volumes
        shell: bash
        run: |
          cd dist
          if [ -d HarmoniaTextor.app ]; then
            target=HarmoniaTextor.app
          else
            target=HarmoniaTextor
          fi
          zip -s 1g -r "HarmoniaTextor-${{ runner.os }}.zip" "$target"

      # ---------- 上传到 Release 附件 ----------
      - name: Upload to Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/HarmoniaTextor-${{ runner.os }}.z* --repo "${{ github.repository }}" --clobber

version = 1
SPDX-PackageName = "HarmoniaTextor"
SPDX-PackageSupplier = "HarmoniaTextor contributors"
SPDX-PackageDownloadLocation = "https://github.com/xhdlphzr/HarmoniaTextor"

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 HarmoniaTextor contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "assets/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 xhdlphzr"
SPDX-License-Identifier = "CC-BY-NC-ND-4.0"

[[annotations]]
path = "app/static/img/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 xhdlphzr"
SPDX-License-Identifier = "CC-BY-NC-ND-4.0"

[[annotations]]
path = "app/static/fonts/**"
precedence = "override"
SPDX-FileCopyrightText = "2011 The Alex Brush Project Authors (https://github.com/googlefonts/alex-brush)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "app/static/vendor/**"
precedence = "override"
SPDX-FileCopyrightText = "OpenSheetMusicDisplay contributors (https://github.com/opensheetmusicdisplay/opensheetmusicdisplay)"
SPDX-License-Identifier = "BSD-3-Clause"

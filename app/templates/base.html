<html lang="{{ 'zh-CN' if lang == 'zh' else 'en' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}HarmoniaTextor{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/franx.ico') }}" />
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/franx.png') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}?v={{ asset_version }}"
    />
  </head>
  <body>
    <div class="aurora" aria-hidden="true"></div>
    <header class="topbar reveal">
      <a class="brand" href="{{ url_for('index') }}">
        <span class="brand-mark">HarmoniaTextor</span>
        <span class="brand-sub">{{ t('brand.tagline') }}</span>
      </a>
      <nav class="topnav">
        <select class="lang-select" id="lang-select" title="{{ t('common.language') }}">
          <option value="en" {% if lang == 'en' %}selected{% endif %}>English</option>
          <option value="zh" {% if lang == 'zh' %}selected{% endif %}>中文</option>
        </select>
        <button type="button" class="btn-icon" id="config-btn" title="{{ t('config.open') }}">&#9881;</button>
      </nav>
    </header>
    <main class="page">{% block content %}{% endblock %}</main>
    <footer class="footer">
      <span>{{ t('footer.license') }}</span>
    </footer>

    <div class="modal hidden" id="config-modal">
      <div class="modal-content">
        <h2>{{ t('config.title') }}</h2>
        <p class="muted small">{{ t('config.saved_to') }} <code>~/.harmonia_textor/config.json</code>{{ t('common.period') }}</p>
        <label>
          <span>{{ t('config.base_url') }}</span>
          <input type="text" id="cfg-base-url" placeholder="https://api.openai.com/v1" />
        </label>
        <label>
          <span>API Key</span>
          <input type="password" id="cfg-api-key" placeholder="sk-..." />
        </label>
        <label>
          <span>{{ t('config.model') }}</span>
          <input type="text" id="cfg-model" placeholder="gpt-4o-mini" />
        </label>
        <label>
          <span>{{ t('config.context_limit') }}</span>
          <input type="number" id="cfg-context-window" min="1" step="1" placeholder="200" />
        </label>
        <label>
          <span>{{ t('common.language') }}</span>
          <select id="cfg-language">
            <option value="en">English</option>
            <option value="zh">中文</option>
          </select>
        </label>
        <div class="modal-actions">
          <button type="button" class="btn" id="config-cancel">{{ t('common.cancel') }}</button>
          <button type="button" class="btn primary" id="config-save">{{ t('common.save') }}</button>
        </div>
      </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script>
      window.I18N = {{ i18n_json | safe }};
      window.LANG = "{{ lang }}";
    </script>
    <script src="{{ url_for('static', filename='vendor/opensheetmusicdisplay.min.js') }}?v={{ asset_version }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}?v={{ asset_version }}"></script>
  </body>
</html>

<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}HarmoniaTextor{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/franx.ico') }}" />
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/franx.png') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}?v={{ asset_version }}"
    />
  </head>
  <body>
    <div class="aurora" aria-hidden="true"></div>
    <header class="topbar reveal">
      <a class="brand" href="{{ url_for('index') }}">
        <span class="brand-mark">HarmoniaTextor</span>
        <span class="brand-sub">神经符号巴赫风格音乐生成</span>
      </a>
      <nav class="topnav">
        <a href="{{ url_for('index') }}">创作</a>
        <button type="button" class="btn-icon" id="config-btn" title="设置 API">&#9881;</button>
      </nav>
    </header>
    <main class="page">{% block content %}{% endblock %}</main>
    <footer class="footer">
      <span>HarmoniaTextor · MIT License · 离线自足</span>
    </footer>

    <div class="modal hidden" id="config-modal">
      <div class="modal-content">
        <h2>API 设置</h2>
        <p class="muted small">配置保存在 <code>~/.harmonia_textor/config.json</code>。</p>
        <label>
          <span>接口地址</span>
          <input type="text" id="cfg-base-url" placeholder="https://api.openai.com/v1" />
        </label>
        <label>
          <span>API Key</span>
          <input type="password" id="cfg-api-key" placeholder="sk-..." />
        </label>
        <label>
          <span>模型</span>
          <input type="text" id="cfg-model" placeholder="gpt-4o-mini" />
        </label>
        <label>
          <span>上下文上限（k token）</span>
          <input type="number" id="cfg-context-window" min="1" step="1" placeholder="200" />
        </label>
        <div class="modal-actions">
          <button type="button" class="btn" id="config-cancel">取消</button>
          <button type="button" class="btn primary" id="config-save">保存</button>
        </div>
      </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="{{ url_for('static', filename='vendor/opensheetmusicdisplay.min.js') }}?v={{ asset_version }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}?v={{ asset_version }}"></script>
  </body>
</html>
